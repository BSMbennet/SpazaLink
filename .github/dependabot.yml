version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      supabase:
        patterns: ["@supabase/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
