name: SpazaLink CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: spazalink-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm ci installs exactly what package-lock.json lists, so builds are repeatable.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Run automated tests
        run: npm test
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Lint workspaces
        run: npm run lint
      - name: Build frontend and backend
        run: npm run build
